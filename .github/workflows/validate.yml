name: تحقّق خارطة الطريق

on:
  push:
    branches: [dev, sadlang]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: تشغيل مدقّق الاتّساق
        run: python scripts/validate_roadmap.py
